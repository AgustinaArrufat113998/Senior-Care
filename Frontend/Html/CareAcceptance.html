<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Aceptación de Cuidado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/CareAcceptance.css">
  <link rel="stylesheet" href="../Css/Global.css">
  <script src="../JS/Components/layout.js" defer></script>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 card p-4 shadow-sm">
        <h3 class="text-primary fw-bold mb-4 text-center">Solicitudes de Cuidado Pendientes</h3>

        <div class="mb-3">
          <label class="form-label fw-semibold">Selecciona una solicitud pendiente</label>
          <select id="pendingRequests" class="form-select">
            <option value="">Cargando solicitudes...</option>
          </select>
        </div>

        <div class="care-info mb-4">
          <h5 class="fw-bold"> Paciente:</h5>
          <p><strong>Nombre:</strong> <span id="pacienteNombre"></span></p>
          <p><strong>Edad:</strong> <span id="pacienteEdad"></span></p>
          <p><strong>Condiciones:</strong> <span id="pacienteCondiciones"></span></p>
          <p><strong>Enfermedades:</strong> <span id="pacienteEnfermedades"></span></p>
        </div>

        <div class="care-details mb-4">
          <h5 class="fw-bold">Detalles del cuidado:</h5>
          <p><strong>Fecha de inicio:</strong> <span id="fechaInicio"></span></p>
          <p><strong>Fecha de finalización:</strong> <span id="fechaFin"></span></p>
          <p><strong>Horario:</strong> <span id="horario"></span></p>
          <p><strong>Dirección:</strong> <span id="direccion"></span></p>
          <p><strong>Tipo de atención:</strong> <span id="tipoAtencion"></span></p>
        </div>

        <div class="payment-info mb-4">
          <h5 class="fw-bold">Forma de pago:</h5>
          <p><strong>Obra Social:</strong> <span id="obraSocial"></span></p>
          <p><strong>Método:</strong> <span id="metodoPago"></span></p>
          <p><strong>Tarifa:</strong> <span id="tarifa"></span></p>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
          <button class="btn btn-green" id="aceptarBtn">Aceptar Cuidado</button>
          <button class="btn btn-blue" id="rechazarBtn">Rechazar</button>
        </div>

        <p id="msg" class="text-center mt-3 fw-semibold"></p>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="module" src="../Js/Pages/CareAcceptance.js"></script>
</body>
</html>
