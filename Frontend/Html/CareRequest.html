<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Solicitud de nuevo cuidado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Css/CareRequest.css">
  <link rel="stylesheet" href="../Css/Global.css">
  <script src="../JS/Components/layout.js" defer></script>
</head>

<body>
  <main class="care-request-wrapper">
    <div class="form-box">
      <h2>Solicitud de nuevo cuidado</h2>
        <form id="careRequestForm" class="row g-3">
          <div class="col-md-6">
            <label for="fechaInicio" class="form-label">Fecha de inicio <span class="text-danger">*</span></label>
            <input type="date" id="fechaInicio" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="fechaFin" class="form-label">Fecha de finalizacion <span class="text-danger">*</span></label>
            <input type="date" id="fechaFin" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="horaInicio" class="form-label">Hora de inicio <span class="text-danger">*</span></label>
            <input type="time" id="horaInicio" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="horaFin" class="form-label">Hora de finalizacion <span class="text-danger">*</span></label>
            <input type="time" id="horaFin" class="form-control" required>
          </div>

          <div class="col-12">
            <label class="form-label">Tipo de atencion preferida <span class="text-danger">*</span></label>
            <div class="row ps-3">
              <div class="col-md-4 form-check">
                <input class="form-check-input" type="radio" id="cuidadorEstudios" name="tipoAtencion" value="Cuidador con estudios">
                <label class="form-check-label" for="cuidadorEstudios">Cuidador con estudios</label>
              </div>
              <div class="col-md-4 form-check">
                <input class="form-check-input" type="radio" id="estudiante" name="tipoAtencion" value="Estudiante">
                <label class="form-check-label" for="estudiante">Estudiante</label>
              </div>
              <div class="col-md-4 form-check">
                <input class="form-check-input" type="radio" id="sinEstudios" name="tipoAtencion" value="Cuidador sin estudios">
                <label class="form-check-label" for="sinEstudios">Sin preferencia</label>
              </div>
            </div>
          </div>

            <div id="carrerasContainer" class="mt-3 hidden">
            <label class="form-label">Carreras o especialidades *</label>
            <div class="dropdown">
                <button class="btn btn-outline-primary dropdown-toggle w-100" type="button" id="carreraDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Seleccionar carreras
                </button>
                <ul class="dropdown-menu w-100 p-2" aria-labelledby="carreraDropdown">
                <li><input class="form-check-input carrera-option" type="checkbox" value="Enfermeria" id="enfermeriaCarrera">
                    <label class="form-check-label ms-2" for="enfermeriaCarrera">Enfermeria</label></li>
                <li><input class="form-check-input carrera-option" type="checkbox" value="Psicologia" id="psicologiaCarrera">
                    <label class="form-check-label ms-2" for="psicologiaCarrera">Psicologia</label></li>
                <li><input class="form-check-input carrera-option" type="checkbox" value="Trabajo Social" id="trabajoSocialCarrera">
                    <label class="form-check-label ms-2" for="trabajoSocialCarrera">Trabajo Social</label></li>
                <li><input class="form-check-input carrera-option" type="checkbox" value="Acompanante Terapeutico" id="acompananteCarrera">
                    <label class="form-check-label ms-2" for="acompananteCarrera">Acompanante Terapeutico</label></li>
                <li><input class="form-check-input carrera-option" type="checkbox" value="Otros" id="otrosCarrera">
                    <label class="form-check-label ms-2" for="otrosCarrera">Otros</label></li>
                </ul>
            </div>
            </div>


          <div id="cuidadosSimplesContainer" class="mt-3 hidden">
            <small class="text-muted">? Cuidado basico (higiene, alimentacion, acompanamiento)</small>
          </div>

          <div class="col-md-6">
            <label for="preferenciaGenero" class="form-label">Preferencia de genero del cuidador</label>
            <select id="preferenciaGenero" class="form-select">
              <option value="">Sin preferencia</option>
              <option value="Masculino">Hombre</option>
              <option value="Femenino">Mujer</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="telefonoEmergencia" class="form-label">Telefono de emergencia <span class="text-danger">*</span></label>
            <input type="tel" id="telefonoEmergencia" class="form-control" placeholder="Ej: 3512345678" required>
          </div>
          <div>
            <label for="enfermedades" class="form-label">Enfermedades</label>
            <select id="enfermedades" class="form-select" multiple></select>

            <label for="medicaciones" class="form-label mt-3">Medicaciones</label>
            <select id="medicaciones" class="form-select" multiple></select>

            <label for="alergias" class="form-label mt-3">Alergias</label>
            <select id="alergias" class="form-select" multiple></select>

            <label for="condiciones" class="form-label mt-3">Condiciones</label>
            <select id="condiciones" class="form-select" multiple></select>
          </div>

          <div class="col-12">
            <label for="careSuggestions" class="form-label">Cuidados o sugerencias especiales</label>
            <textarea id="careSuggestions" class="form-control" rows="3"></textarea>
          </div>

          <div class="col-12 d-flex justify-content-center gap-2 mt-4">
            <button type="button" class="btn-cancel" onclick="window.location.href='Home.html'">Cancelar</button>
            <button type="submit" class="btn-save" onclick="window.location.href='CareRequestResults.html'">Enviar solicitud</button>
          </div>
        </form>

        <p id="msg" class="error"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.19.5/jquery.validate.min.js"></script>
  <script src="../JS/Validation/validation.js"></script>
  <script src="../JS/Pages/CareRequest.js"></script>
</body>
</html>
