<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Resultados de Solicitudes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/CareRequestResults.css">
</head>
<body>
  <div class="container py-5">
    <h2 class="text-center text-white mb-4">Resultados de Solicitudes de Cuidado 🩵</h2>

    <!-- Filtros -->
    <div class="card p-3 mb-4 shadow-sm">
      <div class="row g-3 align-items-center">
        <div class="col-md-3">
          <label class="form-label fw-bold">Fecha de inicio</label>
          <input type="date" id="fechaInicioFiltro" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Tipo de atención</label>
          <select id="tipoAtencionFiltro" class="form-select">
            <option value="">Todas</option>
            <option value="Cuidador con estudios">Cuidador con estudios</option>
            <option value="Estudiante">Estudiante</option>
            <option value="Cuidador sin estudios">Cuidador sin estudios</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Género preferido</label>
          <select id="generoFiltro" class="form-select">
            <option value="">Cualquiera</option>
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button id="btnFiltrar" class="btn btn-primary w-100">Filtrar</button>
        </div>
      </div>
    </div>

    <!-- Lista de resultados -->
    <div id="resultadosContainer" class="scroll-container">
      <!-- Las cards se insertan dinámicamente desde JS -->
    </div>
  </div>

  <!-- Botón flotante -->
  <div class="action-buttons">
    <button class="btn btn-green" onclick="window.location.href='CareRequest.html'">➕ Ver mi solicitud</button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/Pages/CareRequestResults.js"></script>
</body>
</html>
