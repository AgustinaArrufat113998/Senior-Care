<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Editar Perfil de Cuidador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Css/CaregiverEdit.css">
  <script src="../JS/Components/layout.js" defer></script>
</head>
<body>
  <div class="container py-5">
    <div class="edit-card mx-auto p-4 shadow">
      <h2 class="text-center text-primary fw-bold mb-4">Editar Perfil de Cuidador</h2>
      <p class="text-center text-muted mb-4">Actualizá tu información profesional y de contacto</p>

      <form id="caregiverEditForm" class="row g-3">

        <!-- Especialidad y Experiencia -->
        <div class="col-md-6">
          <label for="estudios" class="form-label fw-bold">Especialidad / Estudios realizados *</label>
          <input type="text" id="estudios" class="form-control" placeholder="Ej. Enfermería, Psicología" value="Enfermería" required>
        </div>

        <div class="col-md-6">
          <label for="experiencia" class="form-label fw-bold">Experiencia *</label>
          <input type="text" id="experiencia" class="form-control" placeholder="Ej. 3 años en geriatría" value="2 años en cuidado domiciliario" required>
        </div>

        <!-- Disponibilidad y Tarifa -->
        <div class="col-md-6">
          <label for="disponibilidad" class="form-label fw-bold">Disponibilidad *</label>
          <input type="text" id="disponibilidad" class="form-control" placeholder="Ej. Lunes a viernes 8 a 16 hs" value="Lunes a viernes 9 a 17 hs" required>
        </div>

        <div class="col-md-6">
          <label for="tarifa" class="form-label fw-bold">Tarifa por hora ($) *</label>
          <input type="number" id="tarifa" class="form-control" placeholder="Ej. 5000" value="4500" required>
        </div>

        <!-- Contacto secundario -->
        <div class="col-md-6">
          <label for="contactoSecundario" class="form-label fw-bold">Contacto secundario (opcional)</label>
          <input type="text" id="contactoSecundario" class="form-control" placeholder="Teléfono alternativo" value="3516789999">
        </div>

        <!-- Título o certificado -->
        <div class="col-12">
          <label for="tituloFile" class="form-label fw-bold">Título o certificado (opcional)</label>
          <input type="file" id="tituloFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
          <small class="text-muted">Podés adjuntar tu título universitario o certificado de materias aprobadas.</small>
        </div>

        <!-- Botones -->
        <div class="col-12 d-flex justify-content-center gap-3 mt-4">
          <button type="button" class="btn-cancel" onclick="window.location.href='Home.html'">Cancelar</button>
          <button type="submit" class="btn-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../Js/Pages/CaregiverEdit.js"></script>
</body>
</html>
