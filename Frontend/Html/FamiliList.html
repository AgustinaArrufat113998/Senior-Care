<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="../Css/Family.css">

<body>

    <div class="main-card family-list-container">

            <h2>Mi Familia</h2>

        </div>
        
    </div>

    <script type="module" src="../JS/Pages/FamilyList.js"></script>
