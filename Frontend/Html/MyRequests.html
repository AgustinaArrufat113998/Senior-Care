<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Mis solicitudes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/Global.css">
  <link rel="stylesheet" href="../Css/MyRequests.css">
  <script src="../JS/Components/layout.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <div class="mb-4">
      <p class="text-uppercase text-white-50 mb-1 small">Centro de seguimiento</p>
      <div class="d-flex align-items-center gap-3">
        <h2 class="fw-bold page-title mb-0">Mis solicitudes</h2>
        <span class="badge bg-light text-primary" id="roleBadge">Usuario</span>
      </div>
      <p id="requestsMessage" class="text-muted small mb-0"></p>
    </div>

    <div class="requests-wrapper">
      <section class="mb-4">
        <div class="section-header">
          <h5>Como usuario</h5>
          <span class="badge bg-secondary" id="userCount">0</span>
        </div>
        <div id="userRequestsList"></div>
      </section>

      <section id="carerBlock">
        <div class="section-header">
          <h5>Como caretaker</h5>
          <span class="badge bg-secondary" id="carerCount">0</span>
        </div>
        <div class="mb-3 text-white-50 small">Solicitudes donde eres el cuidador asignado (aceptadas o pendientes).</div>
        <div id="carerRequestsList"></div>
      </section>
    </div>
  </main>

  <!-- Modal detalle de solicitud para caretakers -->
  <div class="modal fade" id="carerRequestModal" tabindex="-1" aria-labelledby="carerRequestModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="carerRequestModalLabel">Detalle de solicitud</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted small">Solicitud #<span id="modalRequestId">-</span></span>
            <span class="badge" id="modalRequestStatus">Estado</span>
          </div>
          <p class="mb-1"><strong>Fechas:</strong> <span id="modalRequestDates">-</span></p>
          <p class="mb-1"><strong>Horario:</strong> <span id="modalRequestTime">-</span></p>
          <p class="mb-1"><strong>Género preferido:</strong> <span id="modalRequestGender">-</span></p>
          <p class="mb-1"><strong>Tel. emergencia:</strong> <span id="modalRequestPhone">-</span></p>
          <p class="mb-1"><strong>Especialidades:</strong> <span id="modalRequestSpecs">-</span></p>
          <p class="mb-0"><strong>Notas:</strong> <span id="modalRequestNotes">-</span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger" id="modalRejectBtn">Rechazar</button>
          <button type="button" class="btn btn-success" id="modalAcceptBtn">Aceptar cuidado</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../Js/Pages/MyRequests.js"></script>
</body>
</html>
