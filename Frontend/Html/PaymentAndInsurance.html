<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Información de pago y obra social</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/PaymentAndInsurance.css">

<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 card p-4 shadow-sm">
        <h3 class="mb-4 text-primary fw-bold">Información de Obra Social y Pago</h3>

        <!-- Sección Obra Social -->
        <div class="mb-4">
          <label for="obraSocialSelect" class="form-label">Seleccione su obra social</label>
          <select id="obraSocialSelect" class="form-select" required>
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="Sin obra social">No tengo obra social</option>
            <option value="PAMI">PAMI</option>
            <option value="OSDE">OSDE</option>
            <option value="Swiss Medical">Swiss Medical</option>
            <option value="Medife">Medife</option>
            <option value="Galeno">Galeno</option>
          </select>
        </div>

        <div class="mb-4" id="planContainer">
          <label for="planSelect" class="form-label">Seleccione su plan</label>
          <select id="planSelect" class="form-select" required>
            <option value="" disabled selected>Seleccione un plan</option>
          </select>
        </div>

        <!-- Sección Métodos de Pago -->
        <div class="mt-5">
          <h4 class="text-success fw-bold mb-3">Método de Pago</h4>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="metodoPago" id="mp" value="mp">
            <label class="form-check-label" for="mp">Mercado de Pago / Tarjeta</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="metodoPago" id="efectivo" value="efectivo">
            <label class="form-check-label" for="efectivo">Efectivo en el momento</label>
          </div>
        </div>

    <button class="btn btn-green" id="btnAccionPago">🤝 Proceder al pago</button>
