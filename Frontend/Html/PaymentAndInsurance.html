<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Información de pago y obra social</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/PaymentAndInsurance.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center g-4">

      <!-- Sección Obra Social -->
      <div class="col-md-6 card p-4 shadow-sm">
        <h3 class="mb-3 text-primary">Obra Social</h3>

        <div class="mb-3">
          <label for="obraSocialSelect" class="form-label fw-bold">Seleccione su obra social</label>
          <select id="obraSocialSelect" class="form-select" required>
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="PAMI">PAMI</option>
            <option value="OSDE">OSDE</option>
            <option value="Swiss Medical">Swiss Medical</option>
            <option value="Medife">Medifé</option>
            <option value="Galeno">Galeno</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="planSelect" class="form-label fw-bold">Seleccione su plan</label>
          <select id="planSelect" class="form-select" required>
            <option value="" disabled selected>Seleccione un plan</option>
          </select>
        </div>
      </div>

      <!-- Sección Métodos de Pago -->
      <div class="col-md-6 card p-4 shadow-sm">
        <h3 class="mb-3 text-success">Métodos de Pago</h3>

        <div class="mb-3">
          <label class="form-label fw-bold">Seleccione método de pago</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="debito">
            <label class="form-check-label" for="debito">Tarjeta de Débito</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="credito">
            <label class="form-check-label" for="credito">Tarjeta de Crédito</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="efectivo">
            <label class="form-check-label" for="efectivo">Efectivo en el momento</label>
          </div>
        </div>

        <!-- Campos para tarjeta -->
        <div id="tarjetaInfo" class="card p-3 mt-3 hidden">
          <label class="form-label fw-bold">Nombre completo (como figura en la tarjeta)</label>
          <input type="text" id="nombreTarjeta" class="form-control mb-2" placeholder="Ej. Agustina Arrufat">

          <label class="form-label fw-bold">DNI del titular</label>
          <input type="text" id="dniTarjeta" class="form-control mb-2" placeholder="Ej. 41234567">

          <label class="form-label fw-bold">Número de tarjeta</label>
          <input type="text" id="numeroTarjeta" class="form-control mb-2" placeholder="XXXX-XXXX-XXXX-XXXX">

          <div class="row">
            <div class="col-md-6">
              <label class="form-label fw-bold">Mes de vencimiento</label>
              <select id="mesVencimiento" class="form-select">
                <option value="" disabled selected>Mes</option>
                <option value="01">01 - Enero</option>
                <option value="02">02 - Febrero</option>
                <option value="03">03 - Marzo</option>
                <option value="04">04 - Abril</option>
                <option value="05">05 - Mayo</option>
                <option value="06">06 - Junio</option>
                <option value="07">07 - Julio</option>
                <option value="08">08 - Agosto</option>
                <option value="09">09 - Septiembre</option>
                <option value="10">10 - Octubre</option>
                <option value="11">11 - Noviembre</option>
                <option value="12">12 - Diciembre</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Año de vencimiento</label>
              <select id="anioVencimiento" class="form-select"></select>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label fw-bold">CVV</label>
            <input type="password" id="cvv" class="form-control" maxlength="3" placeholder="XXX">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón flotante -->
  <div class="action-buttons">
    <button class="btn btn-green">🤝 Solicitar cuidado</button>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pages/PaymentAndInsurance.js"></script>
</body>
</html>
