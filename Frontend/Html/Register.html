<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Css/Register.css">
  <link rel="stylesheet" href="../Css/Global.Css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="register-box">
    <h2>Registro de Usuario</h2>
    <form id="registerForm" class="row g-3">
      <!-- Nombre y Apellido -->
      <div class="col-md-6">
        <label for="nombre" class="form-label"> Nombre </label>
        <input type="text" id="nombre" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="apellido" class="form-label"> Apellido </label>
        <input type="text" id="apellido" class="form-control" required>
      </div>

      <!-- Username -->
      <div class="col-12">
        <label for="username" class="form-label"> Nombre de Usuario</label>
        <input type="text" id="username" class="form-control" required>
      </div>

      <!-- Email -->
      <div class="col-12">
        <label for="email" class="form-label"> Correo Electrónico </label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <!-- Contraseñas -->
      <div class="col-md-6">
        <label for="password" class="form-label"> Contraseña </label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="confirmPassword" class="form-label"> Repetir Contraseña </label>
        <input type="password" id="confirmPassword" class="form-control" required>
      </div>

      <!-- DNI y Teléfono -->
      <div class="col-md-6">
        <label for="dni" class="form-label"> Documento</label>
        <input type="text" id="dni" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="telefono" class="form-label"> Teléfono </label>
        <input type="text" id="telefono" class="form-control" required>
      </div>

      <!-- Fecha y Sexo -->
      <div class="col-md-6">
        <label for="fechaNacimiento" class="form-label"> Fecha de Nacimiento </label>
        <input type="date" id="fechaNacimiento" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="sexo" class="form-label"> Sexo </label>
        <select id="sexo" class="form-select" required>
          <option value="" disabled selected>Seleccione sexo</option>
        </select>
      </div>

      <!-- Edad -->
      <div class="col-md-6">
        <input type="number" id="edad" class="form-control" placeholder="Edad" min="18" max="130">
      </div>

      <!-- Obra Social -->
      <div class="col-md-6">
        <select id="obraSocial" class="form-select">
          <option value="" disabled selected>Seleccione su obra social</option>
          <option value="PAMI">PAMI</option>
          <option value="OSDE">OSDE</option>
          <option value="Swiss Medical">Swiss Medical</option>
          <option value="Medifé">Medife</option>
          <option value="Galeno">Galeno</option>
          <option value="Sancor Salud">SancorSalud</option>
          <option value="OSECAC">Daspu</option>
          <option value="Otra">Otra</option>
        </select>
      </div>

      <!-- Dirección -->
      <h5 class="mt-4 text-primary">Dirección</h5>
      <div class="col-md-12">
        <label for="calle" class="form-label"> Calle/Barrio</label>
        <input type="text" id="calle" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="nroCasa" class="form-label"> N° de casa</label>
        <input type="text" id="nroCasa" class="form-control" required>
      </div>

      <!-- Piso y Depto -->
      <div class="col-12 col-md-6">
        <label class="form-label"> Piso / Depto </label>
        <div class="d-flex gap-2">
          <input type="text" id="piso" class="form-control small-input" placeholder="Piso (opcional)">
          <input type="text" id="depto" class="form-control small-input" placeholder="Depto (opcional)">
        </div>
      </div>

      <!-- País y Provincia -->
      <div class="col-md-6">
        <label for="pais" class="form-label"> Pais </label>
        <select id="pais" class="form-select" required>
          <option value="" disabled selected>Seleccione su pais</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="provincia" class="form-label"> Provincia </label>
        <select id="provincia" class="form-select" disabled required>
          <option value="" disabled selected>Seleccione país primero</option>
        </select>
      </div>

      <div>
        <input type="checkbox" id="aceptoTerminos" required> Acepto los <a href="#" id="linkTerminos">Términos y Condiciones</a>
      </div>

      <!-- Modal de Términos y Privacidad -->
      <div class="modal fade" id="modalTerminos" tabindex="-1" aria-labelledby="modalTerminosLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">

            <div class="modal-header">
              <h5 class="modal-title" id="modalTerminosLabel">Términos y Condiciones de Uso – SeniorCare</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body" id="terminosContent" style="color: #000;"></div>
              <!-- Contenido dinámico cargado desde JS -->
            </div>
          </div>
      </div>

      <!-- Botones -->
      <div class="col-12 d-flex justify-content-center gap-2 mt-3">
        <button type="button" class="btn-cancel" onclick="window.location.href='login.html'">Cancelar</button>
        <button type="submit" class="btn-save">Guardar</button>
      </div>
    </form>
    <p id="msg" class="error"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- <script type="module" src="../Validation/validation.js"></script> -->
  <script type="module" src="../JS/Pages/Register.js" defer></script>
  <script src="../JS/Pages/TyC.js"></script>

</body>
</html>
