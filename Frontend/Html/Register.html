<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeniorCare - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="register-box">
    <h2>Registro de Usuario</h2>
    <form id="registerForm" class="row g-3">
      <!-- Nombre y Apellido -->
      <div class="col-md-6">
        <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="apellido" class="form-control" placeholder="Apellido" required>
      </div>

      <!-- Username -->
      <div class="col-12">
        <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" required>
      </div>

      <!-- Email -->
      <div class="col-12">
        <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required>
      </div>

      <!-- Contraseñas -->
      <div class="col-md-6">
        <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
      </div>
      <div class="col-md-6">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Repetir contraseña" required>
      </div>

      <!-- DNI y Teléfono -->
      <div class="col-md-6">
        <input type="text" id="dni" class="form-control" placeholder="DNI" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="telefono" class="form-control" placeholder="Teléfono" required>
      </div>

      <!-- Fecha y Sexo -->
      <div class="col-md-6">
        <input type="date" id="fechaNacimiento" class="form-control" required>
      </div>
      <div class="col-md-6">
        <select id="sexo" class="form-select" required>
          <option value="" disabled selected>Seleccione sexo</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="O">Otro</option>
        </select>
      </div>

      <!-- Dirección -->
      <h5 class="mt-4 text-primary">Dirección</h5>
      <div class="col-md-6">
        <input type="text" id="calle" class="form-control" placeholder="Calle / Barrio" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="nroCasa" class="form-control" placeholder="N° de casa" required>
      </div>

      <!-- Piso y Depto -->
      <div class="col-12 col-md-6">
        <div class="d-flex gap-2">
          <input type="text" id="piso" class="form-control small-input" placeholder="Piso (opcional)">
          <input type="text" id="depto" class="form-control small-input" placeholder="Depto (opcional)">
        </div>
      </div>

      <!-- País y Provincia -->
      <div class="col-md-6">
        <select id="pais" class="form-select" required>
          <option value="" disabled selected>Seleccione su pais</option>
        </select>
      </div>

      <div class="col-md-6">
        <select id="provincia" class="form-select" disabled required>
          <option value="" disabled selected>Seleccione país primero</option>
        </select>
      </div>

      <!-- Botones -->
      <div class="col-12 d-flex justify-content-center gap-2 mt-3">
        <button type="button" class="btn-cancel" onclick="window.location.href='login.html'">Cancelar</button>
        <button type="submit" class="btn-save">Guardar</button>
      </div>
    </form>
    <p id="msg" class="error"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/Pages/Register.js" defer></script>
</body>
</html>
