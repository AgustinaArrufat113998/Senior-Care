<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeniorCare - Inicio</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../Css/footer.css">
  <script src="../JS/Components/layout.js" defer></script>
</head>

<body>
  <div class="container text-center mt-5">
    <h2>Bienvenido a SeniorCare 🩵</h2>
    <p>Conectamos cuidadores con personas que necesitan asistencia.</p>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 SeniorCare |
    <a id="linkTerminos" href="#">Términos y Condiciones</a>
  </footer>

  <!-- Modal de Términos -->
  <div class="modal fade" id="modalTerminos" tabindex="-1" aria-labelledby="modalTerminosLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        
        <div class="modal-header">
          <h5 class="modal-title" id="modalTerminosLabel">Términos y Condiciones de Uso – SeniorCare</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body" id="terminosContent">
          <!-- El contenido se carga dinámicamente desde JS -->
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- JS personalizado -->
  <script src="../JS/Pages/footer.js"></script>
</body>
</html>
