server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*" 
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, Path=/api/gender/**, Path=/api/address/**, Path=/api/carer/**, Path=/api/specialty/**, Path=/api/skill/**
          filters:
            - StripPrefix=0
        
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
        
        - id: care-service
          uri: http://carerequest-service:8083
          predicates:
            - Path=/api/care/**
          filters:
            - StripPrefix=0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html


jwt:
  secret: claveSuperSeguraParaSeniorCare123!
  expiration: 3600000
