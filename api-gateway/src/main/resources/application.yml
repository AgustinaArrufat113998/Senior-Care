spring.application.name=API Gateway

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**

      default-filters:
        - AddResponseHeader=X-Gateway, SeniorCare-Gateway
